[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mentor-backend"
version = "0.1.0"
description = "AI Mentor API: socratic tutoring, retrieval, and practice."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "anthropic>=0.40",
  "fastapi>=0.115",
  "google-genai>=1.0",
  "httpx>=0.27",
  "langfuse>=4.0,<5",
  "openai>=1.55",
  "opentelemetry-api>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "opentelemetry-sdk>=1.28",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "python-multipart>=0.0.18",
  "pyjwt[crypto]>=2.10",
  "qdrant-client>=1.12",
  "redis>=5.0",
  "sqlalchemy>=2.0.36",
  "stripe>=16.0,<17",
  "svix>=1.40",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8",
  "cryptography>=43",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=app/domain --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["app/domain"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/domain/catalog.py" = ["E501"]
"app/domain/knowledge/pack_concepts.py" = ["E501"]
"app/domain/knowledge/pack_landmarks.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
