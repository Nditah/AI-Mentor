services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mentor
      POSTGRES_PASSWORD: mentor
      POSTGRES_DB: mentor
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentor -d mentor"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "127.0.0.1:6333:6333"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  migrate:
    build:
      context: ../backend
    command: ["python", "-m", "app.cli", "migrate"]
    environment: &api-env
      APP_ENV: development
      DEV_AUTH: "true"
      DATABASE_URL: postgresql+psycopg://mentor:mentor@postgres:5432/mentor
      # Qdrant needs a real embedding model (SRS RAG-010). Set both to use it;
      # otherwise the local store with hash embeddings is used.
      QDRANT_URL: ${QDRANT_URL:-memory}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../backend
    environment: *api-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

volumes:
  postgres:
