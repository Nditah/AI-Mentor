services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mentor
      POSTGRES_PASSWORD: mentor
      POSTGRES_DB: mentor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentor -d mentor"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"

  api:
    build:
      context: ../backend
    environment:
      APP_ENV: development
      DEV_AUTH: "true"
      DATABASE_URL: postgresql+psycopg://mentor:mentor@postgres:5432/mentor
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
