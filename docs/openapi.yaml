  /api/v1/billing/checkout:
    post:
      tags: [Billing]
      operationId: createCheckout
      summary: Start a Stripe Checkout session
      description: |
        Rules:
        - `tier` is `pro` or `research`. The price id comes from server settings.
        - `success_url` and `cancel_url` must start with one of `CORS_ORIGINS`
          (`400` `Return URL must stay on this application.`).
        - Missing Stripe configuration returns 503.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Hosted Checkout URL.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Stripe secret or the selected price is unset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unconfigured:
                  value:
                    detail: Billing is not configured on this server.
                missingPrice:
                  value:
                    detail: That price is not configured.

  /api/v1/webhooks/stripe:
    post:
      tags: [Authentication, Billing]
      operationId: stripeWebhook
      summary: Stripe webhook
      description: |
        No bearer token. Requires header `Stripe-Signature`. Verified with
        `STRIPE_WEBHOOK_SECRET`. Handled types: `checkout.session.completed`,
        `customer.subscription.updated`, `customer.subscription.deleted`.
        Other types are acknowledged and ignored. A missing secret returns 503.
        A bad signature returns 400 (`Invalid Stripe signature.`).
      x-implementation: live
      x-required-role: public
      x-rate-limit-tier: standard
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event object. Do not re-shape it.
              additionalProperties: true
      responses:
        "200":
          description: Event accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Stripe webhook secret is unset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Stripe webhooks are not configured.

  /api/v1/webhooks/clerk:
    post:
      tags: [Authentication, Users]
      operationId: clerkWebhook
      summary: Clerk user webhook
      description: |
        No bearer token. Requires Svix headers `svix-id`, `svix-timestamp`, and
        `svix-signature`, verified with `CLERK_WEBHOOK_SECRET`.

        Handled types: `user.created`, `user.updated`. The account is upserted from
        `data.id`, the first email address, the name, and `public_metadata.role`
        when that role is `student`, `instructor`, or `admin`. Other event types are
        acknowledged and ignored. A bad signature returns 400
        (`Invalid Clerk signature.`). A missing secret returns 503.
      x-implementation: live
      x-required-role: public
      x-rate-limit-tier: standard
      security: []
      parameters:
        - name: svix-id
          in: header
          required: true
          schema:
            type: string
        - name: svix-timestamp
          in: header
          required: true
          schema:
            type: string
        - name: svix-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Clerk Svix event. Do not re-shape it.
              additionalProperties: true
      responses:
        "200":
          description: Event accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Clerk webhook secret is unset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Clerk webhooks are not configured.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Clerk session JWT, algorithm RS256. `sub` is required. Email and name are
        read from `email` and `name` when present. Role is read from
        `metadata.role` or `public_metadata.role`.
    devAuth:
      type: apiKey
      in: header
      name: X-Dev-User-Id
      description: |
        Development and test only, and only when the Authorization header is absent.
        Pattern `^[A-Za-z0-9_-]{1,64}$`. Production returns 401.

  parameters:
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    QuizId:
      name: quiz_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    CardId:
      name: card_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ResourceId:
      name: resource_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    Slug:
      name: slug
      in: path
      required: true
      description: Catalog slug. Lowercase words separated by single hyphens.
      schema:
        $ref: "#/components/schemas/Slug"
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page. Omit on the first page.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    Difficulty:
      name: difficulty
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Difficulty"
    Language:
      name: language
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Language"

  responses:
    BadRequest:
      description: The request was understood and rejected by a domain rule.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: That message can't be used. Ask the learning question in plain text.
    Unauthorized:
      description: |
        Missing or invalid credentials. Details include `Sign in required`,
        `Invalid session`, `Clerk is not configured`, and
        `Send X-Dev-User-Id or sign in with Clerk`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Sign in required
    Forbidden:
      description: The caller is signed in and below the required role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Admin role required.
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Conversation not found.
    ValidationFailed:
      description: |
        Body, query, or path failed schema validation before the handler ran.
        FastAPI emits this shape. Domain rules use 400 instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    TooManyRequests:
      description: Sliding-window limit for this client IP. Wait about a minute.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Too many requests. Try again in a minute.
    Unexpected:
      description: Unhandled server error. The body is not a stable contract.

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: string

    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc:
                type: array
                items:
                  type: [string, integer]
              msg:
                type: string
              type:
                type: string

    Uuid:
      type: string
      format: uuid

    Slug:
      type: string
      minLength: 1
      maxLength: 80
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"

    ConceptSlug:
      type: string
      minLength: 1
      maxLength: 80
      description: A concept slug from the curriculum catalog, such as `q-learning`.

    Role:
      type: string
      enum: [student, instructor, admin]

    Difficulty:
      type: string
      enum: [beginner, intermediate, advanced, expert, phd]

    Language:
      type: string
      enum: [en, fr, es]

    TutorMode:
      type: string
      enum: [socratic, direct]

    MasteryBand:
      type: string
      enum: [strength, developing, gap, unstarted]
      description: "`strength` ≥ 75, `developing` ≥ 60, `gap` > 0, otherwise `unstarted`."

    PublicationStatus:
      type: string
      enum: [draft, review, approved, published, archived]

    Health:
      type: object
      additionalProperties: false
      required: [status, env, vector_store, llm]
      properties:
        status:
          type: string
          const: ok
        env:
          type: string
          examples: [development, test, production]
        vector_store:
          type: string
          enum: [qdrant, local-hash]
        llm:
          type: string
          enum: [external, curriculum]

    Me:
      type: object
      additionalProperties: false
      required: [id, display_name, role, xp, level, streak_days, subscription_status]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        display_name:
          type: string
          maxLength: 120
        role:
          $ref: "#/components/schemas/Role"
        xp:
          type: integer
          minimum: 0
        level:
          type: integer
          minimum: 1
        streak_days:
          type: integer
          minimum: 0
        subscription_status:
          type: string
          description: "`free` until Stripe sets a subscription status such as `active` or `canceled`."
          examples: [free, active, canceled]

    Profile:
      type: object
      additionalProperties: false
      required:
        - display_name
        - country
        - preferred_language
        - current_level
        - learning_goal
        - tutor_style
        - teaching_mode
        - pace
        - math_depth
        - coding_experience
        - mathematics_confidence
        - onboarding_completed
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        country:
          type: [string, "null"]
          description: ISO 3166-1 alpha-2. Null until the learner sets it.
          pattern: "^[A-Z]{2}$"
        preferred_language:
          oneOf:
            - $ref: "#/components/schemas/Language"
            - type: "null"
        current_level:
          oneOf:
            - $ref: "#/components/schemas/Difficulty"
            - type: string
              const: researcher
            - type: "null"
        learning_goal:
          type: [string, "null"]
          maxLength: 2000
        tutor_style:
          type: [string, "null"]
          enum: [friendly, professional, academic, motivational, strict, socratic, null]
        teaching_mode:
          type: [string, "null"]
          enum: [simple, storytelling, visual, mathematical, research, industry, mixed, null]
        pace:
          type: [string, "null"]
          enum: [slow, moderate, fast, intensive, null]
        math_depth:
          type: [string, "null"]
          enum: [none, light, moderate, formal, proofs, null]
        coding_experience:
          type: [string, "null"]
          enum: [none, beginner, intermediate, advanced, null]
        mathematics_confidence:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
        onboarding_completed:
          type: boolean

    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one property is required.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        preferred_language:
          $ref: "#/components/schemas/Language"
        current_level:
          oneOf:
            - $ref: "#/components/schemas/Difficulty"
            - type: string
              const: researcher
        learning_goal:
          type: string
          minLength: 1
          maxLength: 2000
        tutor_style:
          type: string
          enum: [friendly, professional, academic, motivational, strict, socratic]
        teaching_mode:
          type: string
          enum: [simple, storytelling, visual, mathematical, research, industry, mixed]
        pace:
          type: string
          enum: [slow, moderate, fast, intensive]
        math_depth:
          type: string
          enum: [none, light, moderate, formal, proofs]
        coding_experience:
          type: string
          enum: [none, beginner, intermediate, advanced]
        mathematics_confidence:
          type: integer
          minimum: 1
          maximum: 5
        onboarding_completed:
          type: boolean

    ChatRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 8000
        conversation_id:
          type: [string, "null"]
          format: uuid
        mode:
          $ref: "#/components/schemas/TutorMode"
          default: socratic

    ChatTurn:
      type: object
      additionalProperties: false
      required: [conversation_id, mode, stage, concept_slug, reply]
      properties:
        conversation_id:
          $ref: "#/components/schemas/Uuid"
        mode:
          $ref: "#/components/schemas/TutorMode"
        stage:
          type: integer
          minimum: 0
          description: Count of assistant messages already in the conversation before this reply.
        concept_slug:
          type: [string, "null"]
        reply:
          $ref: "#/components/schemas/AssistantMessage"

    AssistantMessage:
      type: object
      additionalProperties: false
      required: [id, role, content]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        role:
          type: string
          const: assistant
        content:
          type: string

    ConversationSummary:
      type: object
      additionalProperties: false
      required: [id, title, mode]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
          maxLength: 200
        mode:
          type: string

    Conversation:
      type: object
      additionalProperties: false
      required: [id, title, mode, messages]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
        mode:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/StoredMessage"

    StoredMessage:
      type: object
      additionalProperties: false
      required: [id, role, content, concept_slug]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        concept_slug:
          type: [string, "null"]

    AgentRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 8000

    AgentRun:
      type: object
      required: [intent, result]
      properties:
        intent:
          type: string
          enum: [tutor, quiz, plan, career, code, research]
        result: {}
      oneOf:
        - $ref: "#/components/schemas/AgentTutor"
        - $ref: "#/components/schemas/AgentQuiz"
        - $ref: "#/components/schemas/AgentPlan"
        - $ref: "#/components/schemas/AgentCareer"
        - $ref: "#/components/schemas/AgentCode"
        - $ref: "#/components/schemas/AgentResearch"
      discriminator:
        propertyName: intent
        mapping:
          tutor: "#/components/schemas/AgentTutor"
          quiz: "#/components/schemas/AgentQuiz"
          plan: "#/components/schemas/AgentPlan"
          career: "#/components/schemas/AgentCareer"
          code: "#/components/schemas/AgentCode"
          research: "#/components/schemas/AgentResearch"

    AgentTutor:
      type: object
      additionalProperties: false
      required: [intent, result]
      properties:
        intent:
          type: string
          const: tutor
        result:
          $ref: "#/components/schemas/ChatTurn"

    AgentQuiz:
      type: object
      additionalProperties: false
      required: [intent, result]
      properties:
        intent:
          type: string
          const: quiz
        result:
          $ref: "#/components/schemas/Quiz"

    AgentPlan:
      type: object
      additionalProperties: false
      required: [intent, result]
      properties:
        intent:
          type: string
          const: plan
        result:
          $ref: "#/components/schemas/StudyPlanCreated"

    AgentCareer:
      type: object
      additionalProperties: false
      required: [intent, result]
      properties:
        intent:
          type: string
          const: career
        result:
          $ref: "#/components/schemas/CareerAdvice"

    AgentCode:
      type: object
      additionalProperties: false
      required: [intent, result]
      properties:
        intent:
          type: string
          const: code
        result:
          type: object
          additionalProperties: false
          required: [message]
          properties:
            message:
              type: string

    AgentResearch:
      type: object
      additionalProperties: false
      required: [intent, result]
      properties:
        intent:
          type: string
          const: research
        result:
          type: object
          additionalProperties: false
          required: [message]
          properties:
            message:
              type: string

    LearningPathSummary:
      type: object
      additionalProperties: false
      required: [slug, title, description, level, concepts]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
        description:
          type: string
        level:
          type: string
        concepts:
          type: integer
          minimum: 0
          description: Number of steps on the path.

    LearningPathDetail:
      type: object
      additionalProperties: false
      required: [slug, title, description, level, steps]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
        description:
          type: string
        level:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PathStep"

    PathStep:
      type: object
      additionalProperties: false
      required: [position, slug, title, estimated_minutes, completed, prerequisites, content_md]
      properties:
        position:
          type: integer
          minimum: 0
        slug:
          type: [string, "null"]
        title:
          type: string
        estimated_minutes:
          type: [integer, "null"]
          minimum: 0
        completed:
          type: boolean
        prerequisites:
          type: array
          items:
            type: string
        content_md:
          type: [string, "null"]

    Lesson:
      type: object
      additionalProperties: false
      required: [slug, title, content_md, estimated_minutes, prerequisites, completed]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
        content_md:
          type: string
        estimated_minutes:
          type: integer
          minimum: 1
        prerequisites:
          type: array
          items:
            $ref: "#/components/schemas/Slug"
        completed:
          type: boolean

    LessonCompletion:
      type: object
      additionalProperties: false
      required: [slug, completed, newly_completed, content_md]
      properties:
        slug:
          type: string
        completed:
          type: boolean
          const: true
        newly_completed:
          type: boolean
        content_md:
          type: string

    QuizGenerateRequest:
      type: object
      additionalProperties: false
      required: [concept_slug]
      properties:
        concept_slug:
          $ref: "#/components/schemas/ConceptSlug"
        difficulty:
          allOf:
            - $ref: "#/components/schemas/Difficulty"
          default: intermediate

    Quiz:
      type: object
      additionalProperties: false
      required: [id, title, difficulty, concept_slug, difficulty_note, coach_note, questions]
