openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AI Mentor API
  version: 0.2.0
  summary: Socratic tutoring, practice, and grounded paper reading.
  description: |
    HTTP contract for the AI Mentor API. All application routes are under `/api/v1`.
    Identity is issued by Clerk. This API verifies the session JWT and stores the learner.

    ## Implementation status

    Every operation sets `x-implementation`:

    - `live` — routed by the current FastAPI app. Schemas match the handlers.
    - `contract` — agreed shape for frontend and backend. The current server does not
      route these paths; a call returns 404 until the handler ships.

    Generate clients from this file. Do not call `contract` operations in production
    until the server advertises them.

    ## Authentication

    Send `Authorization: Bearer <Clerk session JWT>` (RS256, `sub` = Clerk user id).
    Signup, login, password reset, and Google sign-in stay in Clerk. This API learns
    about accounts from the JWT and from `POST /api/v1/webhooks/clerk`.

    The token must verify against the Clerk JWKS and carry the configured issuer, an
    unexpired `exp`, `nbf`/`iat`, and an `azp` listed in `CLERK_AUTHORIZED_PARTIES`
    (plus `aud` when `CLERK_AUDIENCE` is set). Roles are never read from the token;
    the role of record is the database. Staff calls in production also need a verified
    second factor (`fva`), otherwise 403. Suspended accounts get 403.

    In `development` and `test` only, `X-Dev-User-Id` may replace the bearer token.
    The header matches `^[A-Za-z0-9_-]{1,64}$` and never raises a role. Production
    refuses dev auth (`401 Sign in required`). If both credentials are present, the
    bearer token wins.

    ## Rate limits

    Fixed windows, counted in Redis so every replica shares them (SEC-035). Signed-in
    calls are counted per user after authentication; every call is also counted per
    client address before authentication. Limits are off when `APP_ENV=test`, and do not
    apply to `OPTIONS`, `/health`, `/ready`, or `/api/v1/webhooks/*`.

    | Tier | Default | Setting | Key | Paths |
    | --- | --- | --- | --- | --- |
    | `anonymous` | 120 a minute | `ANONYMOUS_RATE_LIMIT_PER_MINUTE` | client address | Every request |
    | `standard` | 60 a minute | `RATE_LIMIT_PER_MINUTE` | user | Every authenticated request |
    | `ai` | 20 a minute | `AI_RATE_LIMIT_PER_MINUTE` | user | `/api/v1/chat`, `/quiz`, `/research`, `/lab`, `/study-plan`, `/agents`, `/career`, `/flashcards`, plus contract routes tagged `ai` |
    | `upload` | 10 an hour | `UPLOAD_RATE_LIMIT_PER_HOUR` | user | `POST /api/v1/research/documents` |

    A rejected call is `429` problem details with `Retry-After`, `RateLimit-Limit`,
    `RateLimit-Remaining`, and `RateLimit-Reset`.

    ## Errors

    Every error is RFC 9457 `application/problem+json` (`Problem`) carrying a
    `trace_id`. Schema failures are `422` with `errors[]` (`ValidationProblem`).
    Unexpected failures are `500` with a generic detail; the trace id finds the log.
    Every response carries `X-Request-Id`.

    ## Roles

    `student` < `instructor` < `admin`. An operation that requires `instructor` also
    allows `admin`.
  license:
    name: Proprietary
servers:
  - url: http://localhost:8000
    description: Local API
tags:
  - name: Health
    description: Process and dependency probe. No auth.
  - name: Authentication
    description: Clerk session verification and identity webhooks. Password flows are not on this API.
  - name: Users
    description: The signed-in account and admin user directory.
  - name: Profiles
    description: Learning preferences and onboarding answers. Contract.
  - name: Learning Paths
    description: Seeded paths from the curriculum catalog.
  - name: Learn
    description: Guided journey. World lists paths; faculty and level are filters.
  - name: Lessons
    description: Lesson completion and lesson reads.
  - name: Quizzes
    description: Generated practice and grading.
  - name: Challenges
    description: One daily challenge per learner. Contract.
  - name: Leaderboards
    description: XP rankings.
  - name: Gamification
    description: XP, levels, streaks, badges, and the learner dashboard.
  - name: Chat
    description: Tutor conversations.
  - name: AI Tutor
    description: Intent routing across tutor, quiz, plan, career, code, and research.
  - name: RAG Search
    description: Retrieval over a learner's papers and, by contract, the published knowledge base.
  - name: Resources
    description: Published knowledge assets visible to learners. Contract.
  - name: Catalog
    description: Published catalog summaries. Public stats feed the marketing site.
  - name: Leads
    description: Public demo and contact forms. Never grant a role.
  - name: Knowledge Repository
    description: Admin and instructor curation, versioning, and publishing. Contract.
  - name: Coding Lab
    description: Restricted Python execution and review.
  - name: Study
    description: Study plans, progress, recommendations, and the concept graph.
  - name: Flashcards
    description: Spaced-repetition cards.
  - name: Career
    description: Role readiness from mastery.
  - name: Admin
    description: User administration.
  - name: Analytics
    description: Instructor and admin aggregates.
  - name: Billing
    description: Stripe Checkout. Prices are configured on the server.

x-rate-limits:
  anonymous:
    requests: 120
    windowSeconds: 60
    key: client-address
    setting: ANONYMOUS_RATE_LIMIT_PER_MINUTE
  standard:
    requests: 60
    windowSeconds: 60
    key: user
    setting: RATE_LIMIT_PER_MINUTE
  ai:
    requests: 20
    windowSeconds: 60
    key: user
    setting: AI_RATE_LIMIT_PER_MINUTE
  upload:
    requests: 10
    windowSeconds: 3600
    key: user
    setting: UPLOAD_RATE_LIMIT_PER_HOUR
  exempt:
    - /health
    - /ready
    - /api/v1/webhooks/stripe
    - /api/v1/webhooks/clerk

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      description: The process is serving. Touches no dependency and reveals no configuration.
      x-implementation: live
      x-required-role: public
      x-rate-limit-tier: exempt
      security: []
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok

  /ready:
    get:
      tags: [Health]
      operationId: getReady
      summary: Readiness probe
      description: |
        Runs `SELECT 1`, and pings Qdrant and Redis when they are configured. Use it as
        the load balancer's readiness check.
      x-implementation: live
      x-required-role: public
      x-rate-limit-tier: exempt
      security: []
      responses:
        "200":
          description: Every configured dependency answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/me:
    get:
      tags: [Authentication, Users, Gamification]
      operationId: getMe
      summary: Current account
      description: |
        Returns the account row for the verified token (or the dev header). A first
        sight creates a `student`; later calls refresh only email and name.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      responses:
        "200":
          description: Signed-in account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Users]
      operationId: updateMe
      summary: Update account settings
      description: |
        Partial update of display name, handle, locale, time zone, country, leaderboard opt-out, and
        equipped title. The handle is unique ignoring case (`409` if taken). The time
        zone must be an IANA name (`422` otherwise); it decides the learner's day for
        streaks and XP caps. `equipped_title` must already be earned (`422` otherwise).
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Account settings after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Users]
      operationId: deleteMe
      summary: Erase my account
      description: |
        FR-ACC-008. Removes the learner's vectors from Qdrant, anonymises the Stripe
        customer, deletes the Clerk user, then deletes every learner-owned row. Staff
        content and audit rows they authored remain with the author cleared. Records a
        `privacy.erasure` audit row keyed by a hash of the subject. If a provider cannot
        be reached the call is `503` and nothing is deleted locally; retry.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      responses:
        "204":
          description: Account erased.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/me/apps:
    get:
      tags: [Authentication, Users]
      operationId: listMyApps
      summary: Applications this account may open
      description: |
        Returns the five platform apps with their origins and whether this account's
        role may use each one. The Learner App is available to every signed-in person.
        Instructor, Institution, and Content Studio require instructor or admin.
        The Admin App requires admin. Each app uses this list for its launcher.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      responses:
        "200":
          description: App launcher entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [code, name, url, available]
                  properties:
                    code:
                      type: string
                      enum: [learner, instructor, institution, studio, admin]
                    name:
                      type: string
                    url:
                      type: string
                      format: uri
                    available:
                      type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/me/export:
    get:
      tags: [Users]
      operationId: exportMe
      summary: Export my data
      description: |
        FR-ACC-007. Everything the platform holds about the learner as one JSON document:
        profile, conversations with messages, quiz results, documents, code submissions,
        flashcards, study plans, concept mastery, and the XP ledger.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      responses:
        "200":
          description: Export document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/onboarding:
    get:
      tags: [Profiles]
      operationId: getOnboarding
      summary: Onboarding academies and placement items
      description: |
        Returns published academies and authored placement questions without answer keys.
        Completing onboarding is `POST /onboarding`. Learners may retake it.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      responses:
        "200":
          description: Current onboarding state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Profiles]
      operationId: completeOnboarding
      summary: Complete onboarding and optional placement
      description: |
        Saves learning preferences, optionally grades the diagnostic without XP, and
        sets `users.onboarded_at`. Recommends Foundations when programming experience
        is `none`.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [academy_slug]
              properties:
                academy_slug:
                  type: string
                  maxLength: 80
                learning_style:
                  type: string
                  enum: [visual, reading, hands_on, auditory, balanced]
                maths_comfort:
                  type: [string, "null"]
                  enum: [none, light, moderate, formal, null]
                programming_experience:
                  type: [string, "null"]
                  enum: [none, some, daily, null]
                weekly_minutes:
                  type: [integer, "null"]
                  minimum: 0
                  maximum: 10080
                answers:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, response]
                    properties:
                      id:
                        type: string
                      response:
                        type: string
      responses:
        "200":
          description: Recommended academy and diagnostic summary.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/profile:
    get:
      tags: [Profiles]
      operationId: getProfile
      summary: Learning profile
      description: |
        Preferences collected at onboarding and editable later. Progress is not reset
        when language or teaching style changes.

        Not routed yet.
      x-implementation: contract
      x-required-role: student
      x-rate-limit-tier: standard
      responses:
        "200":
          description: Stored profile. Missing onboarding fields are null until `PUT`/`PATCH`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Profiles]
      operationId: updateProfile
      summary: Update learning profile
      description: |
        Partial update. At least one field is required. `onboarding_completed` becomes
        true only when the client sends `true`; the server does not infer it.

        Not routed yet.
      x-implementation: contract
      x-required-role: student
      x-rate-limit-tier: standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Profile after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/chat:
    post:
      tags: [Chat, AI Tutor]
      operationId: postChat
      summary: Send a tutor turn
      description: |
        Appends the learner message and one assistant reply. Omitting `conversation_id`
        starts a conversation titled with the first 80 characters of the message.

        Rules:
        - `message` is trimmed, length 1–8000, and rejected when it is empty, contains
          control characters, or is only a prompt-injection phrase (`400`).
        - `mode` is `socratic` (default) or `direct`.
        - `conversation_id`, when set, must belong to the caller (`404`).
        - Only the last 20 messages are sent to the tutor as history.
        - Chat does not execute code and does not read another user's documents.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: ai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Assistant turn. `stage` is how many assistant messages existed before this reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTurn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/chat/stream:
    post:
      tags: [Chat, AI Tutor]
      operationId: postChatStream
      summary: Stream a tutor turn
      description: |
        Same rules as `POST /chat`. The first two Socratic stages are scripted and may
        arrive as a single `delta`. Later stages stream model tokens after the policy
        layer. Events are `meta`, `delta`, `done`, or `error`.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: ai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Server-sent events. `data:` JSON objects.
          content:
            text/event-stream:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/conversations:
    get:
      tags: [Chat]
      operationId: listConversations
      summary: List the caller's conversations
      description: No pagination. Ordered as stored by the repository.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      responses:
        "200":
          description: Conversation summaries without messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/conversations/{conversation_id}:
    get:
      tags: [Chat]
      operationId: getConversation
      summary: Conversation with messages
      description: Returns 404 when the id is unknown or belongs to another user.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation and its messages in creation order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/agents/run:
    post:
      tags: [AI Tutor]
      operationId: runAgent
      summary: Route a message by intent
      description: |
        Classifies the message and dispatches it. The `result` shape depends on `intent`.

        | intent | result | Behaviour |
        | --- | --- | --- |
        | `tutor` | `ChatTurn` | New socratic conversation. |
        | `quiz` | `Quiz` | Intermediate quiz on the detected concept, or `ai-fundamentals`. |
        | `plan` | `StudyPlanCreated` | Study plan whose goal is the message. |
        | `career` | `CareerAdvice` | Role matches from mastery. |
        | `code` | `Redirect` | Does not execute code. Points the learner at the lab. |
        | `research` | `Redirect` | Does not read a file. Points the learner at document upload. |

        The message uses the same screening rules as chat (1–8000, no control characters,
        not injection-only).
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: ai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequest"
      responses:
        "200":
          description: Dispatch result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/learning-paths:
    get:
      tags: [Learning Paths]
      operationId: listLearningPaths
      summary: List learning paths
      description: Public catalog summary. `concepts` is the number of steps, not the step bodies.
      x-implementation: live
      x-required-role: public
      x-rate-limit-tier: standard
      security: []
      responses:
        "200":
          description: Paths seeded from the curriculum catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningPathSummary"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/learning-paths/{slug}:
    get:
      tags: [Learning Paths, Lessons]
      operationId: getLearningPath
      summary: Learning path with lessons
      description: |
        Steps include lesson markdown and whether the caller has completed each lesson.
        Unknown slug returns 404 (`Learning path not found.`).
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Path detail for the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPathDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/learn/world:
    get:
      tags: [Learn]
      operationId: getLearningWorld
      summary: Learning paths with faculty and level filters
      description: |
        World lists every academy-attached learning path. Faculty (AI, Robotics,
        Data Science) and level (beginner, intermediate, advanced) are filters.
        Academies are a third filter, not the listed cards. The default payload
        is unfiltered. Gated paths stay in the list with `locked` true and
        `href` null until the previous path in that academy is complete.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      responses:
        "200":
          description: Filters plus path cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningWorld"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/lessons/{slug}:
    get:
      tags: [Lessons]
      operationId: getLesson
      summary: Read one lesson
      description: |
        Single lesson, including prerequisites and the caller's completion flag.
        Does not award XP.

        Not routed yet. Until it ships, read lesson markdown from
        `GET /api/v1/learning-paths/{slug}`.
      x-implementation: contract
      x-required-role: student
      x-rate-limit-tier: standard
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Lesson body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/progress/lessons/{slug}/complete:
    post:
      tags: [Lessons, Gamification]
      operationId: completeLesson
      summary: Mark a lesson complete
      description: |
        Idempotent for XP: a repeat completion returns `newly_completed: false` and does
        not grant XP again. The first completion grants 40 XP, subject to the daily cap
        of 400. Unknown slug returns 404 (`Lesson not found.`).
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Completion record and the lesson markdown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonCompletion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/quiz/generate:
    post:
      tags: [Quizzes]
      operationId: generateQuiz
      summary: Generate a quiz
      description: |
        Builds a quiz of up to 5 authored questions for the concept. Answer keys are
        not included.

        Rules:
        - Unknown `concept_slug` returns 404 (`Unknown concept.`).
        - A concept with no authored questions returns 404
          (`No authored questions for that concept yet.`).
        - When the requested difficulty has no items, the server uses the concept's
          available items and sets `difficulty_note`.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: ai
      requestBody:
        required: true
        content:
          application/json:
            schema:
