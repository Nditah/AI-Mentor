openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AI Mentor API
  version: 0.1.0
  summary: Socratic tutoring, practice, and grounded paper reading.
  description: |
    HTTP contract for the AI Mentor API. All application routes are under `/api/v1`.
    Identity is issued by Clerk. This API verifies the session JWT and stores the learner.

    ## Implementation status

    Every operation sets `x-implementation`:

    - `live` — routed by the current FastAPI app. Schemas match the handlers.
    - `contract` — agreed shape for frontend and backend. The current server does not
      route these paths; a call returns 404 until the handler ships.

    Generate clients from this file. Do not call `contract` operations in production
    until the server advertises them.

    ## Authentication

    Send `Authorization: Bearer <Clerk session JWT>` (RS256, `sub` = Clerk user id).
    Signup, login, password reset, and Google sign-in stay in Clerk. This API learns
    about accounts from the JWT and from `POST /api/v1/webhooks/clerk`.

    In `development` and `test` only, `X-Dev-User-Id` may replace the bearer token.
    The header matches `^[A-Za-z0-9_-]{1,64}$` and never raises a role. Production
    refuses dev auth (`401 Sign in required`). If both credentials are present, the
    bearer token wins.

    ## Rate limits

    Limits are per client IP, sliding 60-second window, process-local. They are
    disabled when `APP_ENV=test`, and they do not apply to `OPTIONS` or to
    `/health`, `/docs`, `/redoc`, `/openapi.json`.

    | Tier | Default | Setting | Paths |
    | --- | --- | --- | --- |
    | `standard` | 60 requests | `RATE_LIMIT_PER_MINUTE` | Everything else |
    | `ai` | 20 requests | `AI_RATE_LIMIT_PER_MINUTE` | Prefixes `/api/v1/chat`, `/quiz`, `/research`, `/lab`, `/study-plan`, `/agents`, `/career`, `/flashcards`, plus contract routes tagged as `ai` |

    A rejected call is `429` with `{ "detail": "Too many requests. Try again in a minute." }`.
    The server does not send `Retry-After` today.

    ## Errors

    Domain failures use `{ "detail": "<sentence>" }`. Request-body and path-parameter
    schema failures use FastAPI's `422` validation body. Unexpected failures are `500`
    and are not given a stable schema.

    ## Roles

    `student` < `instructor` < `admin`. An operation that requires `instructor` also
    allows `admin`.
  license:
    name: Proprietary
servers:
  - url: http://localhost:8000
    description: Local API
tags:
  - name: Health
    description: Process and dependency probe. No auth.
  - name: Authentication
    description: Clerk session verification and identity webhooks. Password flows are not on this API.
  - name: Users
    description: The signed-in account and admin user directory.
  - name: Profiles
    description: Learning preferences and onboarding answers. Contract.
  - name: Learning Paths
    description: Seeded paths from the curriculum catalog.
  - name: Lessons
    description: Lesson completion and lesson reads.
  - name: Quizzes
    description: Generated practice and grading.
  - name: Challenges
    description: One daily challenge per learner. Contract.
  - name: Leaderboards
    description: XP rankings.
  - name: Gamification
    description: XP, levels, streaks, badges, and the learner dashboard.
  - name: Chat
    description: Tutor conversations.
  - name: AI Tutor
    description: Intent routing across tutor, quiz, plan, career, code, and research.
  - name: RAG Search
    description: Retrieval over a learner's papers and, by contract, the published knowledge base.
  - name: Resources
    description: Published knowledge assets visible to learners. Contract.
  - name: Knowledge Repository
    description: Admin and instructor curation, versioning, and publishing. Contract.
  - name: Coding Lab
    description: Restricted Python execution and review.
  - name: Study
    description: Study plans, progress, recommendations, and the concept graph.
  - name: Flashcards
    description: Spaced-repetition cards.
  - name: Career
    description: Role readiness from mastery.
  - name: Admin
    description: User administration.
  - name: Analytics
    description: Instructor and admin aggregates.
  - name: Billing
    description: Stripe Checkout. Prices are configured on the server.

x-rate-limits:
  standard:
    requests: 60
    windowSeconds: 60
    key: client-ip
    setting: RATE_LIMIT_PER_MINUTE
  ai:
    requests: 20
    windowSeconds: 60
    key: client-ip
    setting: AI_RATE_LIMIT_PER_MINUTE
  exempt:
    - /health
    - /docs
    - /redoc
    - /openapi.json

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness and dependency probe
      description: Runs `SELECT 1`. Reports whether vectors and the language model are external.
      x-implementation: live
      x-required-role: public
      x-rate-limit-tier: exempt
      security: []
      responses:
        "200":
          description: Process is up and the database accepted a query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                env: development
                vector_store: local-hash
                llm: curriculum
        "500":
          $ref: "#/components/responses/Unexpected"

  /api/v1/me:
    get:
      tags: [Authentication, Users, Gamification]
      operationId: getMe
      summary: Current account
      description: |
        Upserts the user from the Clerk token (or the dev header) and returns the
        account row. New dev users are always `student`.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      responses:
        "200":
          description: Signed-in account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/profile:
    get:
      tags: [Profiles]
      operationId: getProfile
      summary: Learning profile
      description: |
        Preferences collected at onboarding and editable later. Progress is not reset
        when language or teaching style changes.

        Not routed yet.
      x-implementation: contract
      x-required-role: student
      x-rate-limit-tier: standard
      responses:
        "200":
          description: Stored profile. Missing onboarding fields are null until `PUT`/`PATCH`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Profiles]
      operationId: updateProfile
      summary: Update learning profile
      description: |
        Partial update. At least one field is required. `onboarding_completed` becomes
        true only when the client sends `true`; the server does not infer it.

        Not routed yet.
      x-implementation: contract
      x-required-role: student
      x-rate-limit-tier: standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Profile after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/chat:
    post:
      tags: [Chat, AI Tutor]
      operationId: postChat
      summary: Send a tutor turn
      description: |
        Appends the learner message and one assistant reply. Omitting `conversation_id`
        starts a conversation titled with the first 80 characters of the message.

        Rules:
        - `message` is trimmed, length 1–8000, and rejected when it is empty, contains
          control characters, or is only a prompt-injection phrase (`400`).
        - `mode` is `socratic` (default) or `direct`.
        - `conversation_id`, when set, must belong to the caller (`404`).
        - Only the last 20 messages are sent to the tutor as history.
        - Chat does not execute code and does not read another user's documents.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: ai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Assistant turn. `stage` is how many assistant messages existed before this reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTurn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/conversations:
    get:
      tags: [Chat]
      operationId: listConversations
      summary: List the caller's conversations
      description: No pagination. Ordered as stored by the repository.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      responses:
        "200":
          description: Conversation summaries without messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/conversations/{conversation_id}:
    get:
      tags: [Chat]
      operationId: getConversation
      summary: Conversation with messages
      description: Returns 404 when the id is unknown or belongs to another user.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation and its messages in creation order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/agents/run:
    post:
      tags: [AI Tutor]
      operationId: runAgent
      summary: Route a message by intent
      description: |
        Classifies the message and dispatches it. The `result` shape depends on `intent`.

        | intent | result | Behaviour |
        | --- | --- | --- |
        | `tutor` | `ChatTurn` | New socratic conversation. |
        | `quiz` | `Quiz` | Intermediate quiz on the detected concept, or `ai-fundamentals`. |
        | `plan` | `StudyPlanCreated` | Study plan whose goal is the message. |
        | `career` | `CareerAdvice` | Role matches from mastery. |
        | `code` | `Redirect` | Does not execute code. Points the learner at the lab. |
        | `research` | `Redirect` | Does not read a file. Points the learner at document upload. |

        The message uses the same screening rules as chat (1–8000, no control characters,
        not injection-only).
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: ai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequest"
      responses:
        "200":
          description: Dispatch result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/learning-paths:
    get:
      tags: [Learning Paths]
      operationId: listLearningPaths
      summary: List learning paths
      description: Public catalog summary. `concepts` is the number of steps, not the step bodies.
      x-implementation: live
      x-required-role: public
      x-rate-limit-tier: standard
      security: []
      responses:
        "200":
          description: Paths seeded from the curriculum catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningPathSummary"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/learning-paths/{slug}:
    get:
      tags: [Learning Paths, Lessons]
      operationId: getLearningPath
      summary: Learning path with lessons
      description: |
        Steps include lesson markdown and whether the caller has completed each lesson.
        Unknown slug returns 404 (`Learning path not found.`).
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Path detail for the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPathDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/lessons/{slug}:
    get:
      tags: [Lessons]
      operationId: getLesson
      summary: Read one lesson
      description: |
        Single lesson, including prerequisites and the caller's completion flag.
        Does not award XP.

        Not routed yet. Until it ships, read lesson markdown from
        `GET /api/v1/learning-paths/{slug}`.
      x-implementation: contract
      x-required-role: student
      x-rate-limit-tier: standard
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Lesson body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/progress/lessons/{slug}/complete:
    post:
      tags: [Lessons, Gamification]
      operationId: completeLesson
      summary: Mark a lesson complete
      description: |
        Idempotent for XP: a repeat completion returns `newly_completed: false` and does
        not grant XP again. The first completion grants 40 XP, subject to the daily cap
        of 400. Unknown slug returns 404 (`Lesson not found.`).
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Completion record and the lesson markdown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonCompletion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/quiz/generate:
    post:
      tags: [Quizzes]
      operationId: generateQuiz
      summary: Generate a quiz
      description: |
        Builds a quiz of up to 5 authored questions for the concept. Answer keys are
        not included.

        Rules:
        - Unknown `concept_slug` returns 404 (`Unknown concept.`).
        - A concept with no authored questions returns 404
          (`No authored questions for that concept yet.`).
        - When the requested difficulty has no items, the server uses the concept's
          available items and sets `difficulty_note`.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: ai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizGenerateRequest"
      responses:
        "200":
          description: Quiz without answer keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/quiz/{quiz_id}/grade:
    post:
      tags: [Quizzes, Gamification]
      operationId: gradeQuiz
      summary: Grade a quiz
      description: |
        Grades the caller's quiz and stores the result. Awards quiz XP from the score
        ratio (10–50), subject to the daily cap.

        Rules:
        - 1–20 answers. Each `response` is at most 20000 characters.
        - The quiz must belong to the caller (`404` `Quiz not found.`).
        - Every `question_id` must belong to that quiz (`400`
          `That question is not part of this quiz.`). Duplicate ids are ignored.
        - Question kinds are `mcq`, `short`, `coding`, and research (anything else).
          Coding answers are executed in the restricted sandbox.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: ai
      parameters:
        - $ref: "#/components/parameters/QuizId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeRequest"
      responses:
        "200":
          description: Score and per-question feedback. Explanations are revealed here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/challenges/today:
    get:
      tags: [Challenges]
      operationId: getTodayChallenge
      summary: Today's challenge
      description: |
        Returns the caller's challenge for the current UTC date. Kinds rotate among
        `quiz` (5 questions), `coding`, and `lesson`. A completed challenge stays
        readable with `status: completed` until the next UTC date.

        Not routed yet.
      x-implementation: contract
      x-required-role: student
      x-rate-limit-tier: standard
      responses:
        "200":
          description: The challenge assigned to this user for today.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/challenges/today/attempts:
    post:
      tags: [Challenges, Gamification]
      operationId: submitTodayChallenge
      summary: Submit today's challenge
      description: |
        One successful attempt per UTC day. A second submit on the same day returns
        409. XP and badges follow the challenge definition and the daily XP cap.

        `answer` is the quiz payload as a JSON string, the Python source, or the
        lesson slug, matching `Challenge.kind`. Maximum 20000 characters. The same
        text screening rules as chat apply.

        Not routed yet.
      x-implementation: contract
      x-required-role: student
      x-rate-limit-tier: ai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeAttemptRequest"
      responses:
        "200":
          description: Graded attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeAttempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Today's challenge was already completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Today's challenge is already complete.
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/challenges:
    get:
      tags: [Challenges]
      operationId: listChallenges
      summary: Challenge history
      description: |
        Newest first. `cursor` is an opaque string from the previous page.

        Not routed yet.
      x-implementation: contract
      x-required-role: student
      x-rate-limit-tier: standard
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of past challenges for the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/leaderboard:
    get:
      tags: [Leaderboards]
      operationId: getLeaderboard
      summary: Global top 10
      description: |
        Public. The ten highest XP totals, ties broken by display name ascending.
        No caller rank and no country filter. Email addresses are not included.
      x-implementation: live
      x-required-role: public
      x-rate-limit-tier: standard
      security: []
      responses:
        "200":
          description: Top 10 learners.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/leaderboards:
    get:
      tags: [Leaderboards]
      operationId: getScopedLeaderboard
      summary: Global or country leaderboard
      description: |
        Authenticated board with the caller's rank. `scope=country` uses the
        country on the caller's profile and returns 409 when that field is unset.

        Not routed yet. Use `GET /api/v1/leaderboard` for the live global top 10.
      x-implementation: contract
      x-required-role: student
      x-rate-limit-tier: standard
      parameters:
        - name: scope
          in: query
          description: Defaults to `global`.
          schema:
            type: string
            enum: [global, country]
            default: global
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Ranked entries plus the caller's position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopedLeaderboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Country scope was requested and the profile has no country.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Set a country on your profile to see that board.
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/dashboard:
    get:
      tags: [Gamification, Analytics]
      operationId: getDashboard
      summary: Learner dashboard
      description: |
        Level is `1 + xp // 250`. Mastery bands are `strength` (75–100),
        `developing` (60–74), and `gap` (1–59). A score of 0 is `unstarted` and is
        omitted from the three lists. Recommendations follow missing prerequisites.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      responses:
        "200":
          description: Progress snapshot for the signed-in learner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/progress:
    get:
      tags: [Gamification, Study]
      operationId: getProgress
      summary: XP and concept mastery
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      responses:
        "200":
          description: Level progress and one row per concept the learner has a mastery score for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/gamification/badges:
    get:
      tags: [Gamification]
      operationId: listBadges
      summary: Badge catalog and earned flags
      description: |
        Same badge objects as `Dashboard.badges`, without the rest of the dashboard.

        Not routed yet. Read badges from `GET /api/v1/dashboard`.
      x-implementation: contract
      x-required-role: student
      x-rate-limit-tier: standard
      responses:
        "200":
          description: Every badge, earned or not.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [badges]
                properties:
                  badges:
                    type: array
                    items:
                      $ref: "#/components/schemas/Badge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/gamification/events:
    get:
      tags: [Gamification]
      operationId: listXpEvents
      summary: XP ledger
      description: |
        Newest first. Only grants above zero are stored. Reasons in use are
        `quiz`, `lesson`, `code`, `review`, and `analysis`. The daily cap is 400 XP.
        Amounts: lesson 40, code 25, review 5, analysis 20, quiz 10–50 from the score ratio.

        Not routed yet.
