  /api/v1/billing/checkout:
    post:
      tags: [Billing]
      operationId: createCheckout
      summary: Start a Stripe Checkout session
      description: |
        Rules:
        - `tier` is `pro` or `research`. The price id comes from server settings.
        - `success_url` and `cancel_url` must match an entry of `STUDIO_ORIGINS`
          (default: the first CORS origin) exactly in scheme, host, and port
          (`400` `Return URL must stay on this application.`).
        - The checkout reuses the learner's Stripe customer and records the tier in
          metadata; the account changes only when the signed webhook arrives.
        - Missing Stripe configuration returns 503.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Hosted Checkout URL.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Stripe secret or the selected price is unset.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                unconfigured:
                  value:
                    detail: Billing is not configured on this server.
                missingPrice:
                  value:
                    detail: That price is not configured.

  /api/v1/webhooks/stripe:
    post:
      tags: [Authentication, Billing]
      operationId: stripeWebhook
      summary: Stripe webhook
      description: |
        No bearer token. Requires header `Stripe-Signature`. Verified with
        `STRIPE_WEBHOOK_SECRET`. Handled types: `checkout.session.completed`,
        `customer.subscription.created`, `customer.subscription.updated`,
        `customer.subscription.deleted`. Other types are acknowledged as `ignored`.

        Each event id is applied once (`duplicate`). An event older than the last one
        applied to the account is `stale` and changes nothing. Checkout sets `active`
        only when payment is `paid` or `no_payment_required`, else `incomplete`. The
        tier comes from checkout metadata or the subscription's price id; deletion
        returns the account to `free`. A missing secret returns 503. A bad signature
        returns 400 (`Invalid Stripe signature.`).
      x-implementation: live
      x-required-role: public
      x-rate-limit-tier: standard
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event object. Do not re-shape it.
              additionalProperties: true
      responses:
        "200":
          description: Event accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/webhooks/clerk:
    post:
      tags: [Authentication, Users]
      operationId: clerkWebhook
      summary: Clerk user webhook
      description: |
        No bearer token. Requires Svix headers `svix-id`, `svix-timestamp`, and
        `svix-signature`, verified with `CLERK_WEBHOOK_SECRET`.

        Handled types: `user.created` and `user.updated` create a `student` or refresh
        email (the primary address) and name. The role is never read from the event.
        `user.deleted` erases the learner as `DELETE /api/v1/me` does, without calling
        Clerk back. Each `svix-id` is applied once. Other types are acknowledged as
        `ignored`. A bad signature returns 400 (`Invalid Clerk signature.`). A missing
        secret returns 503.
      x-implementation: live
      x-required-role: public
      x-rate-limit-tier: standard
      security: []
      parameters:
        - name: svix-id
          in: header
          required: true
          schema:
            type: string
        - name: svix-timestamp
          in: header
          required: true
          schema:
            type: string
        - name: svix-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Clerk Svix event. Do not re-shape it.
              additionalProperties: true
      responses:
        "200":
          description: Event accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Clerk session JWT, algorithm RS256. `sub`, `exp`, `iat`, `iss`, and `azp` are
        required. Email and name are read from `email` and `name` when present. The role
        is never read from the token.
    devAuth:
      type: apiKey
      in: header
      name: X-Dev-User-Id
      description: |
        Development and test only, and only when the Authorization header is absent.
        Pattern `^[A-Za-z0-9_-]{1,64}$`. Production returns 401.

  parameters:
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    QuizId:
      name: quiz_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    CardId:
      name: card_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ResourceId:
      name: resource_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    Slug:
      name: slug
      in: path
      required: true
      description: Catalog slug. Lowercase words separated by single hyphens.
      schema:
        $ref: "#/components/schemas/Slug"
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page. Omit on the first page.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    Difficulty:
      name: difficulty
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Difficulty"
    Language:
      name: language
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Language"

  responses:
    BadRequest:
      description: The request was understood and rejected by a domain rule.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: That message can't be used. Ask the learning question in plain text.
            instance: /api/v1/chat
            trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
    Unauthorized:
      description: |
        Missing or invalid credentials. Sent with `WWW-Authenticate: Bearer`. Details
        include `Sign in required` and `Invalid session`.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Sign in required
    Forbidden:
      description: |
        The caller is signed in and not allowed: below the required role, suspended,
        staff without a second factor, or a workflow rule such as four-eyes approval.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: Admin role required.
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Conversation not found.
    Conflict:
      description: The request conflicts with current state, such as a quiz already submitted or a handle taken.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: This quiz was already submitted. Generate a new one to retry.
    ValidationFailed:
      description: Body, query, or path failed schema validation before the handler ran.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
    TooManyRequests:
      description: A rate limit was reached. Wait for `Retry-After` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
        RateLimit-Limit:
          schema:
            type: integer
        RateLimit-Remaining:
          schema:
            type: integer
        RateLimit-Reset:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:ai-mentor:problem:rate-limited
            title: Too Many Requests
            status: 429
            detail: Too many requests. Try again shortly.
    ServiceUnavailable:
      description: |
        A dependency is down or a feature is switched off (the code lab in production,
        Stripe or webhooks not configured, the search index unreachable). Retry later.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            detail: The code lab is not available yet.
    Unexpected:
      description: Unhandled server error. The detail is generic; quote the `trace_id` when reporting it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, detail, instance, trace_id]
      properties:
        type:
          type: string
          description: "`about:blank`, or `urn:ai-mentor:problem:{kind}` for validation, rate-limited, and not-ready."
          examples: [about:blank, "urn:ai-mentor:problem:rate-limited"]
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: Request path.
        trace_id:
          type: string
          description: OpenTelemetry trace id when tracing is on, otherwise the request id.

    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            type:
              const: "urn:ai-mentor:problem:validation"
            errors:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path:
                    type: string
                    examples: [body.message]
                  message:
                    type: string

    Uuid:
      type: string
      format: uuid

    Slug:
      type: string
      minLength: 1
      maxLength: 80
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"

    ConceptSlug:
      type: string
      minLength: 1
      maxLength: 80
      description: A concept slug from the curriculum catalog, such as `q-learning`.

    Role:
      type: string
      enum: [student, instructor, admin]

    Difficulty:
      type: string
      enum: [beginner, intermediate, advanced, expert, phd]

    Language:
      type: string
      enum: [en, fr, es]

    TutorMode:
      type: string
      enum: [socratic, direct]

    MasteryBand:
      type: string
      enum: [strength, developing, gap, unstarted]
      description: "`strength` ≥ 75, `developing` ≥ 60, `gap` > 0, otherwise `unstarted`."

    PublicationStatus:
      type: string
      enum: [draft, review, approved, published, archived]

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Account:
      type: object
      additionalProperties: false
      required: [id, email, display_name, role, handle, locale, timezone, country_code, leaderboard_opt_out, subscription_status]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          type: string
        display_name:
          type: string
          maxLength: 120
        role:
          $ref: "#/components/schemas/Role"
        handle:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9_]{3,24}$"
        locale:
          $ref: "#/components/schemas/Language"
        timezone:
          type: string
          description: IANA time zone; decides the learner's day.
          examples: [Africa/Lagos, Europe/London]
        country_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
        leaderboard_opt_out:
          type: boolean
        subscription_status:
          type: string
          description: "`free` until Stripe sets a status such as `active`, `incomplete`, or `canceled`."
          examples: [free, active, incomplete, canceled]
        equipped_title:
          type: [string, "null"]
          maxLength: 60
          description: Earned title slug the learner chose to display.
        onboarded:
          type: boolean
          description: True after `POST /onboarding` completes.

    Me:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [xp, level, streak_days]
          properties:
            xp:
              type: integer
              minimum: 0
            level:
              type: integer
              minimum: 1
            streak_days:
              type: integer
              minimum: 0

    AccountUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 120
        handle:
          type: string
          pattern: "^[A-Za-z0-9_]{3,24}$"
        locale:
          $ref: "#/components/schemas/Language"
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        country_code:
          type: string
          pattern: "^[A-Z]{2}$"
        leaderboard_opt_out:
          type: boolean
        equipped_title:
          type: string
          minLength: 1
          maxLength: 60

    AccountExport:
      type: object
      description: Every learner-owned record. Arrays may be empty.
      required: [exported_at, profile, conversations, quiz_results, documents, code_submissions, flashcards, study_plans, mastery, xp_events]
      properties:
        exported_at:
          type: string
          format: date-time
        profile:
          type: object
          additionalProperties: true
        conversations:
          type: array
          items:
            type: object
            additionalProperties: true
        quiz_results:
          type: array
          items:
            type: object
            additionalProperties: true
        documents:
          type: array
          items:
            type: object
            additionalProperties: true
        code_submissions:
          type: array
          items:
            type: object
            additionalProperties: true
        flashcards:
          type: array
          items:
            type: object
            additionalProperties: true
        study_plans:
          type: array
          items:
            type: object
            additionalProperties: true
        mastery:
          type: array
          items:
            type: object
            additionalProperties: true
        xp_events:
          type: array
          items:
            type: object
            additionalProperties: true

    Profile:
      type: object
      additionalProperties: false
      required:
        - display_name
        - country
        - preferred_language
        - current_level
        - learning_goal
        - tutor_style
        - teaching_mode
        - pace
        - math_depth
        - coding_experience
        - mathematics_confidence
        - onboarding_completed
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        country:
          type: [string, "null"]
          description: ISO 3166-1 alpha-2. Null until the learner sets it.
          pattern: "^[A-Z]{2}$"
        preferred_language:
          oneOf:
            - $ref: "#/components/schemas/Language"
            - type: "null"
        current_level:
          oneOf:
            - $ref: "#/components/schemas/Difficulty"
            - type: string
              const: researcher
            - type: "null"
        learning_goal:
          type: [string, "null"]
          maxLength: 2000
        tutor_style:
          type: [string, "null"]
          enum: [friendly, professional, academic, motivational, strict, socratic, null]
        teaching_mode:
          type: [string, "null"]
          enum: [simple, storytelling, visual, mathematical, research, industry, mixed, null]
        pace:
          type: [string, "null"]
          enum: [slow, moderate, fast, intensive, null]
        math_depth:
          type: [string, "null"]
          enum: [none, light, moderate, formal, proofs, null]
        coding_experience:
          type: [string, "null"]
          enum: [none, beginner, intermediate, advanced, null]
        mathematics_confidence:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
        onboarding_completed:
          type: boolean

    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one property is required.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        preferred_language:
          $ref: "#/components/schemas/Language"
        current_level:
          oneOf:
            - $ref: "#/components/schemas/Difficulty"
            - type: string
              const: researcher
        learning_goal:
          type: string
          minLength: 1
          maxLength: 2000
        tutor_style:
          type: string
          enum: [friendly, professional, academic, motivational, strict, socratic]
        teaching_mode:
          type: string
          enum: [simple, storytelling, visual, mathematical, research, industry, mixed]
        pace:
          type: string
          enum: [slow, moderate, fast, intensive]
        math_depth:
          type: string
          enum: [none, light, moderate, formal, proofs]
        coding_experience:
          type: string
          enum: [none, beginner, intermediate, advanced]
        mathematics_confidence:
          type: integer
          minimum: 1
          maximum: 5
        onboarding_completed:
          type: boolean

    ChatRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 8000
        conversation_id:
          type: [string, "null"]
