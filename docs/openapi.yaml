  /api/v1/research/documents:
    post:
      tags: [RAG Search]
      operationId: uploadResearchDocument
      summary: Upload a paper the caller owns
      description: |
        Parses, chunks, and embeds the file for that user only. Other learners cannot
        retrieve it.

        Rules:
        - Multipart field name is `file`.
        - At most 10 MiB (`413`).
        - Extensions: `.pdf`, `.docx`, `.md`, `.txt`. Anything else is `400`.
        - PDF bytes must start with `%PDF`. DOCX bytes must be a zip (`PK`).
        - Text and Markdown must be UTF-8.
        - Empty extracts, including scanned PDFs, are `400`.
        - Ten uploads an hour per user.

        All chunks are embedded in one call and indexed in `learner_docs_v1` under the
        owner and document id. If the index is unavailable the document is still stored,
        with status `unindexed`, and analysis reads its opening passages instead.
      x-implementation: live
      x-required-role: student
      x-rate-limit-tier: upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF, DOCX, Markdown, or UTF-8 text. Maximum 10485760 bytes.
      responses:
        "200":
          description: Document is ready to analyse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: File is larger than 10 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Content Too Large
                status: 413
                detail: Files must be 10 MB or smaller.
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

