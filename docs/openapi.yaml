  /api/v1/admin/knowledge/{resource_id}/transition:
    post:
      tags: [Knowledge Repository, Admin]
      operationId: transitionKnowledgeAsset
      summary: Move a knowledge asset through review
      description: |
        Allowed edges:

        | From | To | Role |
        | --- | --- | --- |
        | `draft` | `review` | instructor |
        | `review` | `draft` | admin |
        | `review` | `approved` | admin |
        | `approved` | `published` | admin |
        | `approved` | `archived` | admin |
        | `published` | `archived` | admin |
        | `archived` | `draft` | admin |

        Any other edge is 409. Publishing indexes chunks into Qdrant and makes the
        asset visible to `GET /api/v1/resources` and `POST /api/v1/knowledge/search`.
        Archiving removes it from retrieval.

        Not routed yet.
      x-implementation: contract
      x-required-role: instructor
      x-rate-limit-tier: standard
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/PublicationStatus"
      responses:
        "200":
          description: Asset after the transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeAsset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
